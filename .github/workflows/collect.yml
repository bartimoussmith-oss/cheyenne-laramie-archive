name: Collect approved public sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect.py'
      - 'sources.json'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: public-archive-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector syntax
        run: python -m py_compile scripts/collect.py
      - name: Resume bounded collection
        run: python scripts/collect.py
      - name: Publish source objects and measured coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add objects/ state.json ledger.jsonl status.json
          if [ -d text ]; then git add text/; fi
          if ! git diff --cached --quiet; then
            git commit -m "archive: preserve public sources and collection checkpoint"
            git push origin HEAD:main
          fi
