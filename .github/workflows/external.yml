name: Resume county collection and processing
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/external.py'
      - 'scripts/run_external.py'
      - 'external-sources.json'
      - '.github/workflows/external.yml'
permissions:
  contents: write
concurrency:
  group: public-archive-collector
  cancel-in-progress: false
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts
        run: python -m py_compile scripts/external.py scripts/run_external.py scripts/collect.py scripts/adapters.py scripts/process.py
      - name: Install free local PDF and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Retry scoped external collection with precise request diagnostics
        id: external
        continue-on-error: true
        run: python scripts/run_external.py
      - name: Resume pending government-source queue
        id: collection
        continue-on-error: true
        run: python scripts/collect.py
      - name: Process preserved PDF pages and measure partitions
        id: processing
        continue-on-error: true
        run: python scripts/process.py
      - name: Preserve completed outputs and failures
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in objects text derived proposals state.json ledger.jsonl status.json external-state.json external-status.json derived-status.json network-events.jsonl; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "archive: preserve acquisition, diagnostics and PDF checkpoints"
            git push origin HEAD:main
          fi
      - name: Report unsuccessful stages
        if: always() && !cancelled()
        env:
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
          PROCESSING_OUTCOME: ${{ steps.processing.outcome }}
        run: |
          test "$EXTERNAL_OUTCOME" = success
          test "$COLLECTION_OUTCOME" = success
          test "$PROCESSING_OUTCOME" = success
