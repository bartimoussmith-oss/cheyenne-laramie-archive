name: Continue bounded archive backlog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/progress.py'
      - '.github/workflows/continue.yml'
permissions:
  contents: write
concurrency:
  group: public-archive-collector
  cancel-in-progress: false
jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts
        run: python -m py_compile scripts/collect.py scripts/process.py scripts/progress.py scripts/external.py scripts/run_external.py scripts/adapters.py
      - name: Check known runnable backlog
        id: backlog
        run: echo "runnable=$(python scripts/progress.py)" >> "$GITHUB_OUTPUT"
      - name: Install free local PDF and OCR tools
        if: steps.backlog.outputs.runnable == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Run bounded continuation and checkpoint each round
        if: steps.backlog.outputs.runnable == 'yes'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          failed=0
          for round in 1 2 3 4; do
            if [ "$(python scripts/progress.py)" != yes ]; then break; fi
            if [ "$round" = 1 ]; then
              if ! python scripts/run_external.py; then failed=1; fi
            fi
            if ! python scripts/collect.py; then failed=1; fi
            if ! python scripts/process.py; then failed=1; fi
            python scripts/progress.py
            for p in objects text derived proposals state.json ledger.jsonl status.json external-state.json external-status.json derived-status.json network-events.jsonl continuation-status.json; do
              if [ -e "$p" ]; then git add -- "$p"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "archive: checkpoint bounded continuation round $round"
              git push origin HEAD:main
            fi
          done
          test "$failed" = 0
      - name: Preserve final continuation assessment
        if: always() && !cancelled()
        run: |
          python scripts/progress.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- continuation-status.json
          if ! git diff --cached --quiet; then
            git commit -m "archive: record remaining backlog and capacity state"
            git push origin HEAD:main
          fi
